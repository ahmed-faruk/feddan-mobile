name: feddan
description: "Feddan — Smart farm assistant for Egyptian farmers. Arabic-first, weather-aware task management."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency injection
  get_it: ^7.7.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Maps
  google_maps_flutter: ^2.9.0

  # HTTP
  dio: ^5.7.0

  # Location
  geolocator: ^13.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Code generation annotations (builders added per feature)
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
